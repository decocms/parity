name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Lint
        run: bun run lint

      # `--changed` resolves paths against the vitest root, which after the
      # monorepo move is packages/parity. Running this from the repo root would
      # find no test files at all.
      - name: Test (changed only)
        if: github.event_name == 'pull_request'
        working-directory: packages/parity
        run: bunx vitest run --changed origin/${{ github.base_ref }}

      - name: Test (all)
        if: github.event_name != 'pull_request'
        run: bun run test

      - name: Dead code (informational)
        run: bun run deadcode
        continue-on-error: true
