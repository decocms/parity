name: Publish

# Auto-publish on every merge to `main`.
#
# Model: each push to main publishes a new @decocms/parity version to npm — no
# manual bump ceremony, so features never get stuck unpublished (the bug the
# monorepo introduced: `npm version` at the root bumped the private wrapper, not
# packages/parity, so the old path-gated trigger never fired).
#
# Version selection (computed in CI, see the "Compute next version" step):
#   - If packages/parity/package.json version is GREATER than what's on npm, use
#     it verbatim — this is how you cut an intentional minor/major: bump that file
#     in the PR and CI respects it.
#   - Otherwise auto-increment the PATCH from the latest published version.
# Either way the next version is always > npm, so every merge publishes exactly
# once. CI commits the resolved version + tag back to main (best-effort; a
# GITHUB_TOKEN push does NOT re-trigger this workflow, so no loop).
#
# DO NOT RENAME THIS FILE: the npm trusted-publisher rule is bound to the
# workflow *filename* (publish.yml) — renaming it breaks OIDC publishing.
#
# OIDC trusted publishing (one-time setup, already done): Trusted Publisher rule
# on npmjs.com → @decocms/parity → repo decocms/parity, workflow publish.yml,
# blank environment, action npm publish. The publish job needs id-token: write.
#
# Manual break-glass: `npm publish` from packages/parity on a maintainer machine
# with `npm login` if the workflow is wedged.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # workflow_dispatch exposes a branch picker; guard so it only ever runs
    # against main. Skip our own release commit as belt-and-suspenders (a
    # GITHUB_TOKEN push already won't re-trigger, but a manual re-run might).
    if: >-
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'chore(release):')
    permissions:
      contents: write   # for the version commit + tag + release
      id-token: write   # for npm OIDC / provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # history for --generate-notes + push-back

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Compute next version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          NEXT=$(node -e '
            const cp = require("node:child_process");
            const local = require("./packages/parity/package.json").version;
            let npmv = "0.0.0";
            try {
              const o = cp.execSync("npm view @decocms/parity version", {
                encoding: "utf8", stdio: ["pipe", "pipe", "ignore"],
              }).trim();
              if (o) npmv = o;
            } catch {}
            const parts = (v) => v.split("-")[0].split(".").map(Number);
            const cmp = (a, b) => {
              const A = parts(a), B = parts(b);
              for (let i = 0; i < 3; i++) if ((A[i]||0) !== (B[i]||0)) return (A[i]||0) - (B[i]||0);
              return 0;
            };
            let next;
            if (cmp(local, npmv) > 0) next = local;             // intentional minor/major bump
            else { const p = parts(npmv); p[2]++; next = p.join("."); }  // auto-patch
            console.log(next);
          ')
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"
          echo "Publishing @decocms/parity@$NEXT"

      # Node 22 ships npm 10.x, which lacks the OIDC token-exchange path needed
      # for trusted publishing. Force latest npm (11.x+) so `npm publish` gets
      # the OIDC client instead of a disguised-401 → 404 on the publish PUT.
      - name: Upgrade npm to a version that supports OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set version
        working-directory: packages/parity
        run: npm version "${{ steps.version.outputs.next }}" --no-git-tag-version --allow-same-version

      - name: Build
        working-directory: packages/parity
        run: bun run build

      - name: Publish to npm
        # MUST run from the package dir: `npm publish` at the repo root would
        # target the private workspace wrapper, not @decocms/parity. Trusted
        # publishing supplies access + provenance from package.json/OIDC.
        working-directory: packages/parity
        run: npm publish

      - name: Commit version bump + tag back to main
        # Best-effort: npm is the source of truth. If the push is rejected
        # (branch protection / main advanced), the publish already happened —
        # warn, don't fail. Next merge recomputes from npm regardless.
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): ${{ steps.version.outputs.next }} [skip ci]" || echo "nothing to commit"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "HEAD:main" --follow-tags || echo "::warning::could not push version bump back to main; npm already has ${{ steps.version.outputs.next }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes
