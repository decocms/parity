name: Publish

# Auto-publish on every merge to `main`.
#
# Model: each push to main publishes a new @decocms/parity version to npm — no
# manual bump ceremony, so features never get stuck unpublished (the bug the
# monorepo introduced: `npm version` at the root bumped the private wrapper, not
# packages/parity, so the old path-gated trigger never fired).
#
# Version selection (computed in CI, see the "Compute next version" step):
#   - If packages/parity/package.json version is GREATER than what's on npm, use
#     it verbatim — this is how you cut an intentional minor/major: bump that file
#     in the PR and CI respects it.
#   - Otherwise auto-increment the PATCH from the latest published version.
# Either way the next version is always > npm, so every merge publishes exactly
# once. `main` is branch-protected, so CI does NOT commit the bump back — npm is
# the source of truth and the version is recomputed from it each run. The git tag
# + GitHub release are created via `gh release create --target <sha>` (tag
# creation isn't blocked by branch protection), so the repo package.json version
# just acts as a floor / manual minor-major override, and may lag npm.
#
# DO NOT RENAME THIS FILE: the npm trusted-publisher rule is bound to the
# workflow *filename* (publish.yml) — renaming it breaks OIDC publishing.
#
# OIDC trusted publishing (one-time setup, already done): Trusted Publisher rule
# on npmjs.com → @decocms/parity → repo decocms/parity, workflow publish.yml,
# blank environment, action npm publish. The publish job needs id-token: write.
#
# Manual break-glass: `npm publish` from packages/parity on a maintainer machine
# with `npm login` if the workflow is wedged.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize publishes. The version is computed by reading what is currently on npm, and that read
# is not atomic: two pushes landing close together both read npm before either has published,
# both compute the same patch, and the second dies with
# `You cannot publish over the previously published versions`. Observed with four merges inside
# five minutes (issue #299) — three published, the fourth failed and needed a manual re-run.
#
# `cancel-in-progress: false` is load-bearing: cancelling a queued run would skip publishing that
# commit entirely, which is worse than waiting. The job is short, so the queue is short.
concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # workflow_dispatch exposes a branch picker; guard so it only ever runs
    # against main. Skip our own release commit as belt-and-suspenders (a
    # GITHUB_TOKEN push already won't re-trigger, but a manual re-run might).
    if: >-
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'chore(release):')
    permissions:
      contents: write   # for the version commit + tag + release
      id-token: write   # for npm OIDC / provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # history for --generate-notes + push-back

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Compute next version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          NEXT=$(node -e '
            const cp = require("node:child_process");
            const local = require("./packages/parity/package.json").version;
            let npmv = "0.0.0";
            try {
              const o = cp.execSync("npm view @decocms/parity version", {
                encoding: "utf8", stdio: ["pipe", "pipe", "ignore"],
              }).trim();
              if (o) npmv = o;
            } catch {}
            const parts = (v) => v.split("-")[0].split(".").map(Number);
            const cmp = (a, b) => {
              const A = parts(a), B = parts(b);
              for (let i = 0; i < 3; i++) if ((A[i]||0) !== (B[i]||0)) return (A[i]||0) - (B[i]||0);
              return 0;
            };
            let next;
            if (cmp(local, npmv) > 0) next = local;             // intentional minor/major bump
            else { const p = parts(npmv); p[2]++; next = p.join("."); }  // auto-patch
            console.log(next);
          ')
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"
          echo "Publishing @decocms/parity@$NEXT"

      # Node 22 ships npm 10.x, which lacks the OIDC token-exchange path needed
      # for trusted publishing. Force latest npm (11.x+) so `npm publish` gets
      # the OIDC client instead of a disguised-401 → 404 on the publish PUT.
      - name: Upgrade npm to a version that supports OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set version
        # Edit package.json directly. `npm version` chokes inside a workspace
        # member ("Cannot read properties of null (reading 'matches')"), so we
        # write the field ourselves — no git tag, formatting preserved.
        run: |
          node -e '
            const fs = require("node:fs");
            const p = "packages/parity/package.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            j.version = process.argv[1];
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
          ' "${{ steps.version.outputs.next }}"

      - name: Build
        working-directory: packages/parity
        run: bun run build

      - name: Publish to npm
        # MUST run from the package dir: `npm publish` at the repo root would
        # target the private workspace wrapper, not @decocms/parity. Trusted
        # publishing supplies access + provenance from package.json/OIDC.
        working-directory: packages/parity
        run: npm publish

      - name: Tag + GitHub release
        # `main` is branch-protected, so pushing the version bump back is
        # blocked. We don't need it: npm is the source of truth and the
        # Compute step derives the next version from npm every run (the repo's
        # package.json version is just a floor / manual minor-major override).
        # `gh release create --target <sha>` creates the tag ref remotely at the
        # published commit — tag creation is NOT blocked by branch protection —
        # and the release in one call, no `git push` to main required.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes

      - name: Notify Discord
        # Lives here rather than in its own `on: release` workflow so it reuses
        # the version this run already computed — no second source of truth for
        # "what's a new version".
        #
        # continue-on-error: a failed notification must never turn a successful
        # publish red. The package is on npm either way; someone not seeing a
        # Discord message is not a release failure.
        if: success()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          VERSION: ${{ steps.version.outputs.next }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # Secret absent on forks and for contributors without access — skip
          # quietly instead of curling to an empty URL.
          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "DISCORD_WEBHOOK not set — skipping notification."
            exit 0
          fi
          # Build the payload with jq: the version flows in from a CI output and
          # hand-rolled JSON breaks on quotes.
          #
          # Two things ship from this repo and they update differently:
          #   - the CLI, from npm, pinned to the version this run published;
          #   - the Claude Code plugin, served by the marketplace straight from
          #     this repo (marketplace.json `source: "./"`), so it has no version
          #     of its own to pin — `marketplace update` is what pulls the new
          #     commits, and `plugin update` then applies them.
          # Announcing only the npm line left plugin users with no way to get the
          # change they were just told about.
          jq -n \
            --arg version "$VERSION" \
            --arg url "$RELEASE_URL" \
            '{
               username: "parity",
               embeds: [{
                 title: ("@decocms/parity v" + $version),
                 url: $url,
                 description: "Nova versão publicada.",
                 color: 5814783,
                 fields: [
                   {
                     name: "CLI",
                     value: ("```\nnpm i -g @decocms/parity@" + $version + "\n```")
                   },
                   {
                     name: "Plugin do Claude Code",
                     value: "```\nclaude plugin marketplace update parity\nclaude plugin update parity\n```\nReinicie o Claude Code para aplicar."
                   }
                 ]
               }]
             }' \
            | curl -sS --fail-with-body -X POST "$DISCORD_WEBHOOK" \
                -H 'Content-Type: application/json' \
                -d @-
          echo "Notified Discord: $TAG"
